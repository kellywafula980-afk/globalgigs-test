<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - GlobalGigs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-zinc-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-zinc-900/60 border border-zinc-800 rounded-2xl p-8">
        
        <!-- Back to home -->
        <a href="/" class="text-emerald-400 hover:text-emerald-300 transition block mb-6">← Back to jobs</a>
        
        <!-- Header -->
        <div class="mb-8">
            <h2 class="text-3xl font-black text-white">Welcome Back</h2>
            <p class="text-zinc-400">Sign in to manage your job listings</p>
        </div>
        
        <!-- Login Form -->
        <form method="POST" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label for="username" class="block text-zinc-400 text-sm font-medium mb-1">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    id="username"
                    required
                    class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white focus:outline-none focus:border-emerald-500 transition placeholder-zinc-500"
                    placeholder="Enter your username"
                >
            </div>
            
            <div>
                <label for="password" class="block text-zinc-400 text-sm font-medium mb-1">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    id="password"
                    required
                    class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white focus:outline-none focus:border-emerald-500 transition placeholder-zinc-500"
                    placeholder="Enter your password"
                >
            </div>
            
            <button 
                type="submit" 
                class="w-full px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-black font-bold rounded-xl transition shadow-lg shadow-emerald-500/20"
            >
                Sign In
            </button>
        </form>
        
        <!-- Sign up link -->
        <p class="text-center text-zinc-500 text-sm mt-6">
            Don't have an account? <a href="{% url 'signup' %}" class="text-emerald-400 hover:text-emerald-300 font-medium">Create one now</a>
        </p>
    </div>
</body>
</html>
