<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - GlobalGigs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-zinc-100 min-h-screen">
    
    <header class="border-b border-zinc-800 bg-zinc-950/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 font-black text-2xl text-white">
                <span class="text-emerald-500">💼</span> GLOBAL<span class="text-emerald-400">GIGS</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="{% url 'dashboard' %}" class="text-sm text-zinc-400 hover:text-white transition">← Dashboard</a>
                <a href="{% url 'logout' %}" class="text-sm text-red-400 hover:text-red-300 transition">Logout</a>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8">
        <h2 class="text-3xl font-black text-white mb-6">👤 Your Profile</h2>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-4 bg-zinc-900/60 border border-zinc-800 rounded-2xl p-8">
            {% csrf_token %}
            
            <div>
                <label class="block text-zinc-400 text-sm font-medium mb-1">Company Name</label>
                {{ profile_form.company_name }}
            </div>
            
            <div>
                <label class="block text-zinc-400 text-sm font-medium mb-1">Company Website</label>
                {{ profile_form.company_website }}
            </div>
            
            <div>
                <label class="block text-zinc-400 text-sm font-medium mb-1">Phone</label>
                {{ profile_form.phone }}
            </div>
            
            <div>
                <label class="block text-zinc-400 text-sm font-medium mb-1">Company Bio</label>
                {{ profile_form.bio }}
            </div>
            
            <div>
                <label class="block text-zinc-400 text-sm font-medium mb-1">Company Logo</label>
                {{ profile_form.company_logo }}
                {% if profile.company_logo %}
                    <div class="mt-2">
                        <img src="{{ profile.company_logo.url }}" alt="Logo" class="h-20 w-20 object-contain rounded-lg border border-zinc-700">
                    </div>
                {% endif %}
            </div>
            
            <button type="submit" class="w-full px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-black font-bold rounded-xl transition">
                Save Profile
            </button>
        </form>
    </main>
</body>
</html>
