<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Job - GlobalGigs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-zinc-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-zinc-900/60 border border-zinc-800 rounded-2xl p-8">
        <h2 class="text-2xl font-black text-white mb-4">⚠️ Delete Job</h2>
        <p class="text-zinc-400 mb-6">
            Are you sure you want to delete "<span class="text-white font-bold">{{ job.title }}</span>"?
            This action cannot be undone.
        </p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="flex gap-3">
                <a href="{% url 'dashboard' %}" class="flex-1 px-6 py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-xl transition text-center">
                    Cancel
                </a>
                <button type="submit" class="flex-1 px-6 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl transition">
                    Yes, Delete
                </button>
            </div>
        </form>
    </div>
</body>
</html>
